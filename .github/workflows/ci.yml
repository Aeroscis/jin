name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The discipline checkers (tools/*.py) are Python; npm scripts invoke
      # them as `python`, which only setup-python guarantees on the runner.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The version lives in package.json's `devEngines.packageManager`, which
      # pnpm/action-setup does not read, so it is repeated here — keep the two
      # in step. This must run before setup-node, whose `cache: pnpm` needs the
      # pnpm store path to exist.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
