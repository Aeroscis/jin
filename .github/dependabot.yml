# Dependabot runs on the GitHub mirror. Dev dependencies only — the library
# has no runtime dependencies, so these PRs are tooling updates, each gated
# by the ci workflow before it can land.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      devtools:
        dependency-type: development
    ignore:
      # TypeScript 7 is the native compiler and no longer ships the JavaScript
      # Compiler API that unplugin-dts drives to emit declarations, so the build
      # fails at `prepare` — i.e. inside `pnpm install`, before any check runs. The
      # documented migration is to install `@typescript/typescript6` alongside
      # it, which is a toolchain-wide move done deliberately, not a weekly chore.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
